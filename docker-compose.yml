version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: planimo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planimo
    ports:
      - "5432:5432"
    volumes:
      - planimo_postgres_data:/var/lib/postgresql/data

volumes:
  planimo_postgres_data:
